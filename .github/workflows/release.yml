# Builds the suite zip and publishes it as a GitHub release.
#
# * Push to main: when RUIN Core's version (## Version in RUIN_Core.toc) has
#   no release yet, this builds the zip and publishes the release
#   v<version> (for example v0.4.2) with the version's change log entries as
#   notes. So a new version is published as soon as the
#   suite repo's submodules point at it; nothing else to do.
# * Push a tag like v0.4.2 yourself: builds the zip and attaches it to
#   that tag's release (as before).
# * Run it by hand from the Actions tab: builds the zip (and publishes the
#   release if the version has none).
#
# The addon repos are public, so no extra token is needed; if they ever go
# private again, add a fine-grained token with read-only "Contents" access to
# the RUIN_* repos as the secret SUITE_TOKEN.
name: Release suite
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Every test suite (including the security tests) must pass on Lua 5.1
  # before anything is built or published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          token: ${{ secrets.SUITE_TOKEN || github.token }}
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Run the tests
        run: ./tests/run.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    # only this job can write (it publishes the release)
    permissions:
      contents: write
    steps:
      # third-party actions are pinned to a commit, so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUITE_TOKEN || github.token }}

      - name: Work out the version
        id: v
        run: |
          version=$(sed -n 's/^## Version: *//p' RUIN_Core/RUIN_Core.toc | tr -d '\r')
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # a release for this version already exists, also under an older
          # name like v0.4.1_Beta-1
          if git ls-remote --tags origin | awk '{print $2}' | grep -Eq "^refs/tags/${tag//./\\.}(_.*)?(\^\{\})?$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "RUIN Core $version -> $tag"

      - name: Build zip
        # RUIN_RELEASE_SEED signs the release notice players' RUIN passes on
        # to everyone on an older version (tools/release/notice.py)
        env:
          RUIN_RELEASE_SEED: ${{ secrets.RUIN_RELEASE_SEED }}
        run: ./build.sh

      - name: Release notes from the change logs
        if: github.ref_type != 'tag' && steps.v.outputs.exists == 'false'
        run: |
          python3 - <<'EOF'
          import os, re
          out = ["RUIN Gaming Companion App %s. Extract the zip into your WoW Forever `Interface/AddOns` folder.\n" % os.environ["VERSION"]]
          rows = []
          import subprocess
          # the addons that changed since the last release (their submodule moved)
          prev = subprocess.run(["git", "describe", "--tags", "--abbrev=0", "HEAD"], capture_output=True, text=True).stdout.strip()
          changed = None
          if prev:
              changed = set(subprocess.run(["git", "diff", "--name-only", prev, "HEAD"], capture_output=True, text=True).stdout.split())
              print("changes since", prev, ":", sorted(c for c in changed if c.startswith("RUIN_")))
          for addon in ["RUIN_Core", "RUIN_Finder", "RUIN_Muster", "RUIN_Pathfinder", "RUIN_Codex", "RUIN_Exchange"]:
              toc = open(f"{addon}/{addon}.toc", encoding="utf-8").read()
              ver = re.search(r"^## Version:\s*(\S+)", toc, re.M).group(1)
              rows.append(f"| {addon.replace('_', ' ')} | {ver} |")
              log = open(f"{addon}/CHANGELOG.md", encoding="utf-8").read()
              m = re.search(r"^## " + re.escape(ver) + r"\b.*?\n(.*?)(?=^## |\Z)", log, re.M | re.S)
              if m and m.group(1).strip() and (changed is None or addon in changed or any(c.startswith(addon + "/") for c in changed)):
                  out.append(f"**{addon.replace('_', ' ')} {ver}**\n\n" + m.group(1).strip() + "\n")
          if len(out) == 1:
              out.append("No addon changed since %s.\n" % prev)
          out.append("| Addon | Version |\n| --- | --- |\n" + "\n".join(rows))
          out.append("\nFound a problem? Settings → Feedback in the RUIN window.")
          open("notes.md", "w", encoding="utf-8").write("\n".join(out))
          EOF
        env:
          VERSION: ${{ steps.v.outputs.version }}

      - name: Publish the new version
        if: github.ref_type != 'tag' && steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.zip

      - name: Attach to a tag's release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip

  # Uploads each version's zip to CurseForge (project 1784493) once.
  # Needs the repository secret CF_API_KEY (authors.curseforge.com > API Tokens).
  # The changelog is curseforge/<version>.md when that file exists, otherwise
  # the GitHub release notes. After a successful upload the job pushes the tag
  # curseforge/v<version>, so each version is uploaded only once; delete that
  # tag to upload a version again.
  curseforge:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_PROJECT: "1784493"
      CF_GAME_VERSION: "1.60.1"
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out what to upload
        id: v
        run: |
          # the newest release; the build job above has just published it if it was new
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          version=${tag#v}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$CF_API_KEY" ]; then
            echo "No CF_API_KEY secret; skipping CurseForge."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/curseforge/$tag" | grep -q .; then
            echo "$tag is already on CurseForge."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Uploading $tag to CurseForge."; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to CurseForge
        if: steps.v.outputs.skip == 'false'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p cf
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '[.assets[] | select(.name | endswith(".zip"))][0].id')
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > cf/addon.zip
          name=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '[.assets[] | select(.name | endswith(".zip"))][0].name')
          if [ -f "curseforge/$VERSION.md" ]; then cp "curseforge/$VERSION.md" cf/changelog.md
          else gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q .body > cf/changelog.md; fi
          curl -fsS -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions > cf/versions.json
          python3 - <<'PY'
          import json, os
          versions = json.load(open("cf/versions.json"))
          want = os.environ["CF_GAME_VERSION"]
          ids = [v["id"] for v in versions if v.get("name") == want]
          if not ids:
              raise SystemExit("CurseForge has no WoW game version named %s" % want)
          meta = {
              "changelog": open("cf/changelog.md", encoding="utf-8").read(),
              "changelogType": "markdown",
              "displayName": "RUIN Companion App " + os.environ["VERSION"],
              "gameVersions": ids[:1],
              "releaseType": "release",
          }
          json.dump(meta, open("cf/metadata.json", "w"))
          print("game version", want, "->", ids[0])
          PY
          curl -fsS -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<cf/metadata.json" \
            -F "file=@cf/addon.zip;filename=$name;type=application/zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT/upload-file"
          echo
          git tag "curseforge/$TAG" "$GITHUB_SHA"
          git push origin "curseforge/$TAG"
